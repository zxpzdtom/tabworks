<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                color-scheme: light;
                --bg: #f3f6fa;
                --panel: #ffffff;
                --ink: #151922;
                --muted: #667085;
                --soft: #98a2b3;
                --line: #e2e7ef;
                --line-strong: #d5dbe5;
                --blue: #2563eb;
                --blue-ink: #1746a2;
                --blue-soft: #eaf1ff;
                --green: #12805c;
                --green-soft: #e7f6ef;
                --amber: #b7791f;
                --amber-soft: #fff4df;
                --red: #c2413a;
                --red-soft: #fff0ee;
                --control-shadow:
                    0 0 0 1px rgba(15, 23, 42, 0.08),
                    0 1px 2px rgba(15, 23, 42, 0.07);
                --lift-shadow:
                    0 0 0 1px rgba(15, 23, 42, 0.06),
                    0 8px 22px rgba(15, 23, 42, 0.08);
            }

            * {
                box-sizing: border-box;
            }

            html {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            body {
                width: 356px;
                margin: 0;
                color: var(--ink);
                background: var(--bg);
                font-family:
                    -apple-system, BlinkMacSystemFont, "PingFang SC",
                    "Helvetica Neue", Arial, sans-serif;
                font-size: 12px;
            }

            button {
                font: inherit;
            }

            code,
            .mono {
                font-family: "SF Mono", Menlo, Consolas, monospace;
                font-variant-numeric: tabular-nums;
            }

            .shell {
                padding: 0;
            }

            .frame {
                overflow: hidden;
                border-radius: 0;
                background: var(--panel);
                box-shadow: none;
            }

            .topbar {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 12px;
                align-items: center;
                min-height: 58px;
                padding: 13px 16px 12px;
                border-bottom: 1px solid var(--line);
                background: #ffffff;
            }

            .brand {
                min-width: 0;
            }

            .brand h1 {
                margin: 0;
                font-size: 17px;
                line-height: 1.15;
                letter-spacing: 0;
            }

            .brand p {
                margin: 4px 0 0;
                color: var(--muted);
                font-size: 11.5px;
                line-height: 1.25;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .pill {
                min-height: 31px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                padding: 0 11px;
                border-radius: 999px;
                color: var(--muted);
                background: #fff;
                box-shadow: var(--control-shadow);
                white-space: nowrap;
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }

            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--soft);
            }

            .dot.connected {
                background: var(--green);
            }

            .dot.connecting {
                background: var(--amber);
            }

            .dot.disconnected {
                background: var(--red);
            }

            .status {
                display: grid;
                gap: 10px;
                padding: 13px 16px 14px;
                border-bottom: 1px solid var(--line);
                background: #fbfcfe;
            }

            .status-head {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 12px;
                align-items: start;
            }

            .status-title {
                display: block;
                font-size: 14px;
                line-height: 1.25;
            }

            .status-detail {
                display: block;
                margin-top: 4px;
                color: var(--muted);
                font-size: 11.5px;
                line-height: 1.45;
                text-wrap: pretty;
            }

            .endpoint {
                color: var(--soft);
                font-size: 10px;
                line-height: 17px;
                text-align: right;
            }

            .service-tools {
                display: none;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px;
                align-items: center;
                min-height: 34px;
                padding: 8px 8px 8px 11px;
                border-radius: 12px;
                color: #0f5138;
                background: var(--green-soft);
            }

            .service-tools.visible {
                display: grid;
                color: #0f5138;
                background: var(--green-soft);
            }

            .service-tools span {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 11.5px;
            }

            .actions {
                display: none;
            }

            .btn {
                min-height: 34px;
                border: 0;
                border-radius: 10px;
                padding: 0 12px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                color: var(--ink);
                background: #eef2f7;
                box-shadow: var(--control-shadow);
                cursor: pointer;
                transition-property: background-color, box-shadow, color, transform, opacity;
                transition-duration: 150ms;
                transition-timing-function: ease-out;
                white-space: nowrap;
            }

            .btn:hover {
                background: #e7edf5;
                box-shadow:
                    0 0 0 1px rgba(15, 23, 42, 0.1),
                    0 2px 6px rgba(15, 23, 42, 0.1);
            }

            .btn:active {
                transform: scale(0.96);
            }

            .btn.primary {
                color: #fff;
                background: var(--blue);
            }

            .btn.primary:hover {
                background: #1d56d8;
            }

            .btn.danger {
                color: #fff;
                background: var(--red);
            }

            .btn.danger:hover {
                background: #ad332d;
            }

            .btn:disabled {
                cursor: default;
                opacity: 1;
                transform: none;
            }

            .btn:disabled:hover {
                box-shadow: var(--control-shadow);
            }

            .btn.danger:disabled {
                color: #94a3b8;
                background: #edf2f7;
            }

            .btn.small {
                min-height: 26px;
                min-width: 48px;
                padding: 0 8px;
                border-radius: 8px;
                color: #0f5138;
                background: #fff;
            }

            .meta-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                color: var(--muted);
                font-size: 11px;
                line-height: 1.3;
            }

            .meta-row span {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .recorder {
                display: grid;
                gap: 10px;
                padding: 13px 16px 15px;
                border-bottom: 1px solid var(--line);
                background: #f7f9fc;
            }

            .recorder-card {
                display: grid;
                gap: 10px;
                padding: 13px;
                border-radius: 16px;
                background: #ffffff;
                box-shadow: var(--lift-shadow);
            }

            .recorder-head {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 10px;
                align-items: center;
            }

            .recorder-title {
                display: flex;
                align-items: center;
                gap: 7px;
                min-width: 0;
            }

            .recorder-title strong {
                font-size: 13px;
                line-height: 1.2;
            }

            .rec-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--soft);
            }

            .rec-dot.active {
                background: var(--red);
                box-shadow: 0 0 0 4px rgba(194, 65, 58, 0.12);
            }

            .recorder-state {
                color: var(--muted);
                min-height: 22px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0 8px;
                border-radius: 999px;
                background: #f1f5f9;
                font-size: 10.5px;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }

            .recorder-detail {
                color: var(--muted);
                font-size: 11.5px;
                line-height: 1.45;
                text-wrap: pretty;
            }

            .recorder-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }

            .recorder-actions .btn {
                min-height: 38px;
            }

            .recorder-secondary {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }

            .recorder-secondary[hidden] {
                display: none;
            }

            .recorder-copy {
                min-height: 36px;
                justify-self: stretch;
                color: var(--blue);
                background: #fff;
            }

            .recorder-copy[hidden] {
                display: none;
            }

            .section {
                padding: 10px 13px 11px;
                border-bottom: 1px solid var(--line);
            }

            .section-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-bottom: 0;
            }

            .head-actions {
                display: flex;
                align-items: center;
                gap: 4px;
            }

            .section-title {
                margin: 0;
                color: #5b6678;
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 0.09em;
                line-height: 1;
                text-transform: uppercase;
            }

            .text-link {
                min-height: 28px;
                border: 0;
                border-radius: 8px;
                padding: 0 7px;
                color: var(--blue);
                background: transparent;
                cursor: pointer;
                transition-property: background-color, transform;
                transition-duration: 150ms;
                transition-timing-function: ease-out;
            }

            .text-link:hover {
                background: var(--blue-soft);
            }

            .text-link:active {
                transform: scale(0.96);
            }

            .settings {
                display: grid;
                gap: 2px;
                padding: 9px 10px 10px;
                background: #ffffff;
            }

            .switch-row {
                min-height: 38px;
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 12px;
                align-items: center;
                padding: 5px 6px 5px 9px;
                border-radius: 12px;
            }

            .switch-row:hover {
                background: #f7f9fc;
            }

            .switch-label {
                display: grid;
                gap: 2px;
                min-width: 0;
            }

            .switch-label strong {
                font-size: 12px;
                line-height: 1.2;
            }

            .switch-label span {
                color: var(--muted);
                font-size: 10px;
                line-height: 1.35;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .toggle {
                position: relative;
                width: 40px;
                height: 24px;
                flex: 0 0 auto;
            }

            .toggle input {
                width: 0;
                height: 0;
                opacity: 0;
            }

            .toggle-track {
                position: absolute;
                inset: 0;
                border-radius: 999px;
                background: #c6cedb;
                cursor: pointer;
                transition-property: background-color;
                transition-duration: 160ms;
                transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
            }

            .toggle-track::after {
                content: "";
                position: absolute;
                top: 3px;
                left: 3px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 1px 3px rgba(15, 23, 42, 0.24);
                transition-property: transform;
                transition-duration: 160ms;
                transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
            }

            .toggle input:checked + .toggle-track {
                background: var(--green);
            }

            .toggle input:checked + .toggle-track::after {
                transform: translateX(16px);
            }
        </style>
    </head>
    <body>
        <main class="shell">
            <section class="frame" aria-label="TabWorks Bridge">
                <header class="topbar">
                    <div class="brand">
                        <h1>TabWorks Bridge</h1>
                        <p>Chrome 自动化扩展</p>
                    </div>
                    <div class="pill" aria-live="polite">
                        <span class="dot disconnected" id="dot"></span>
                        <span id="status">检查中</span>
                    </div>
                </header>

                <section class="status">
                    <div class="status-head">
                        <div>
                            <strong class="status-title" id="status-title">
                                正在检查连接
                            </strong>
                            <span class="status-detail" id="status-detail">
                                扩展可独立查看能力，本地服务在线后会自动握手。
                            </span>
                        </div>
                        <span class="endpoint mono" id="service-meta">extension</span>
                    </div>

                    <div class="service-tools" id="service-tools">
                        <span>日志服务未检测到</span>
                        <button class="btn small" id="logs-btn">打开日志</button>
                    </div>

                    <div class="meta-row">
                        <span id="sessions">暂无活动窗口</span>
                        <span id="service-state">日志服务未检测到</span>
                    </div>
                </section>

                <section class="recorder" aria-label="UI 操作录制">
                    <div class="section-head">
                        <h2 class="section-title">UI Recorder</h2>
                        <button class="text-link" id="guide-btn">接口说明</button>
                    </div>
                    <div class="recorder-card">
                        <div class="recorder-head">
                            <div class="recorder-title">
                                <span class="rec-dot" id="recorder-dot"></span>
                                <strong id="recorder-title">未开始录制</strong>
                            </div>
                            <span class="recorder-state mono" id="recorder-state">
                                extension
                            </span>
                        </div>
                        <div class="recorder-detail" id="recorder-detail">
                            打开目标网页后，从这里开始录制点击、输入、滚动和页面跳转。
                        </div>
                        <div class="recorder-actions">
                            <button class="btn primary" id="recorder-start">
                                开始录制
                            </button>
                            <button class="btn danger" id="recorder-stop" disabled>
                                停止录制
                            </button>
                        </div>
                        <div class="recorder-secondary" id="recorder-secondary" hidden>
                            <button class="btn" id="recorder-replay">
                                回放录制
                            </button>
                            <button class="btn recorder-copy" id="recorder-download">
                                下载脚本
                            </button>
                        </div>
                    </div>
                </section>

                <section class="settings" aria-label="自动化设置">
                    <div class="switch-row">
                        <div class="switch-label">
                            <strong>前台模式</strong>
                            <span>自动化窗口执行时保持可见</span>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" id="foreground-toggle" />
                            <span class="toggle-track"></span>
                        </label>
                    </div>
                    <div class="switch-row">
                        <div class="switch-label">
                            <strong>保留标签页</strong>
                            <span>任务结束后不自动关闭页面</span>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" id="keeptab-toggle" />
                            <span class="toggle-track"></span>
                        </label>
                    </div>
                </section>
            </section>
        </main>

        <script src="popup.js"></script>
    </body>
</html>
